# Poste la section « À publier » du CHANGELOG.md sur Discord (avec le numéro de version de package.json)
# après chaque déploiement réussi en production, vide aussitôt la section (pour ne jamais reposter), puis étiquette la version. Rien n'est posté si la section est vide ou si le déploiement échoue.
# Secret requis : DISCORD_WEBHOOK_URL (Settings > Secrets and variables > Actions).
name: Annonce Discord des nouveautés

on:
  deployment_status:

permissions:
  contents: write

concurrency:
  group: annonce-discord
  cancel-in-progress: false

jobs:
  annoncer:
    # Vercel crée un déploiement GitHub par mise en ligne ; seul celui de production réussi compte.
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Un numéro déjà publié (étiquette existante) = oubli d'augmenter package.json : on n'annonce rien.
      # « À publier » reste intact, les lignes partiront au prochain déploiement avec un nouveau numéro.
      - name: Vérifier que la version est nouvelle
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "::error::La version $VERSION a déjà été annoncée. Augmente le numéro dans package.json : l'annonce partira au prochain déploiement."
            exit 1
          fi

      - name: Poster les nouveautés sur Discord
        id: publier
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: https://guilde-nine.vercel.app
        run: node scripts/publier-changelog.mjs

      # Le message de commit commence par « chore(changelog) » : vercel.json demande à Vercel de ne pas redéployer pour ça.
      - name: Vider la section publiée
        if: steps.publier.outputs.publie == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(changelog): nouveautés annoncées sur Discord"
          git push

      # Étiquette Git et « Release » GitHub pour la version annoncée, sur le commit déployé.
      # Après le vidage : si elle échoue, l'annonce et le changelog restent cohérents (avertissement seulement).
      - name: Étiqueter la version sur GitHub
        if: steps.publier.outputs.publie == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" --target "${{ github.event.deployment.sha }}" --title "Version $VERSION" --notes-file notes-version.md
